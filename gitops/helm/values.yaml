# The apps domain of the cluster. Routes are built from it.
clusterDomain: apps.ocp4.stormshift.coe.muc.redhat.com

imagePullPolicy: Always

# The component we build ourselves in the Tekton pipeline.
# The pipeline writes the new tag into this file and pushes it back to git -
# Argo CD picks the change up and rolls it out. This line is the GitOps demo.
locationExtractor:
  name: location-extractor
  replicaCount: 1
  image: quay.io/mdargatz/icedemo
  imageTag: initial
  version: v1
  ports:
    containerPort: 5000
    servicePort: 8081

newsBackend:
  name: news-backend
  replicaCount: 1
  image: quay.io/k8snativedev/news-backend
  imageTag: openshift
  ports:
    containerPort: 8080
    servicePort: 8080

newsFrontend:
  name: news-frontend
  replicaCount: 1
  image: quay.io/k8snativedev/news-frontend
  imageTag: openshift
  ports:
    containerPort: 8080
    servicePort: 80

feedScraper:
  name: feed-scraper
  replicaCount: 1
  image: quay.io/k8snativedev/feed-scraper
  imageTag: openshift
  feedsUrl: >-
    http://feeds.bbci.co.uk/news/world/rss.xml,
    https://www.aljazeera.com/xml/rss/all.xml,
    https://www.nytimes.com/svc/collections/v1/publish/https://www.nytimes.com/section/world/rss.xml,
    https://timesofindia.indiatimes.com/rssfeeds/296589292.cms,
    https://www.cnbc.com/id/100727362/device/rss/rss.html

# No Red Hat image ships the PostGIS extension, so we pin the upstream one.
postgis:
  name: postgis
  image: postgis/postgis
  imageTag: "15-3.4"
  database: news
  user: postgres
  password: banane
  ports:
    containerPort: 5432
    servicePort: 5400
