schemaVersion: 2.2.2
metadata:
  name: ice-demo
  displayName: ICE Demo - LocalNews
  description: >-
    One workspace for the whole demo. Edit the location-extractor, run its
    tests, push and watch the Tekton pipeline pick it up - and scan the
    dependencies with a model that runs on this cluster.
  tags:
    - Python
    - AI
    - Security
    - OpenShift
  language: Python
  projectType: Python

projects:
  - name: ice-demo
    git:
      remotes:
        origin: https://github.com/maxisses/ice-demo.git
      checkoutFrom:
        revision: main

components:
  - name: dev
    container:
      # Red Hat Universal Developer Image: python 3.9 and 3.11, node 22, plus
      # oc, tkn and git already on the PATH.
      image: registry.redhat.io/devspaces/udi-rhel9:latest
      memoryRequest: 1Gi
      memoryLimit: 6Gi
      cpuRequest: 200m
      cpuLimit: 2000m
      mountSources: true
      endpoints:
        - name: flask
          targetPort: 5000
          exposure: public
          protocol: https
      env:
        - name: ICE_DEMO_NAMESPACE
          value: md-ice-demo-part1
        # Where npm -g puts things. We deliberately do NOT override PATH here:
        # replacing it costs you /usr/sbin and whatever the image's own
        # entrypoint prepends, and a half-built PATH is a miserable thing to
        # debug in a terminal. ai/install.sh appends to ~/.bashrc instead.
        - name: NPM_CONFIG_PREFIX
          value: /home/user/.npm-global
        - name: PIP_CACHE_DIR
          value: /home/user/.cache/pip
      volumeMounts:
        # Only /projects is persisted by default, so anything the install
        # command puts in the home directory is gone after a restart. These
        # two keep the scanner and the agent where we left them.
        - name: npm-tools
          path: /home/user/.npm-global
        - name: python-tools
          path: /home/user/.local
  - name: npm-tools
    volume:
      size: 2Gi
  - name: python-tools
    volume:
      size: 3Gi

commands:
  - id: install-tooling
    exec:
      label: "1. Install dependencies, the scanner and the coding agent"
      component: dev
      workingDir: ${PROJECT_SOURCE}
      commandLine: ./ai/install.sh
      group:
        kind: build
        isDefault: true

  - id: run-tests
    exec:
      label: "2. Run the unit tests"
      component: dev
      workingDir: ${PROJECT_SOURCE}/components/location-extractor
      commandLine: python3.11 -m pytest test -v
      group:
        kind: test
        isDefault: true

  - id: scan-dependencies
    exec:
      label: "3. Scan the dependencies for known vulnerabilities"
      component: dev
      workingDir: ${PROJECT_SOURCE}
      commandLine: python3.11 -m pip_audit -r ai/demo-requirements.txt --progress-spinner off
      group:
        kind: test

  - id: ai-dependency-review
    exec:
      label: "4. Ask the model what to do about them"
      component: dev
      workingDir: ${PROJECT_SOURCE}
      commandLine: python3.11 ai/dependency-review.py ai/demo-requirements.txt
      group:
        kind: run
        isDefault: true

  - id: coding-agent
    exec:
      label: "5. Open the coding agent"
      component: dev
      workingDir: ${PROJECT_SOURCE}
      commandLine: ./ai/agent.sh
      group:
        kind: run

  - id: run-dev
    exec:
      label: "6. Run the location-extractor locally"
      component: dev
      workingDir: ${PROJECT_SOURCE}/components/location-extractor
      commandLine: python3.11 -m src.server
      group:
        kind: run

  - id: setup-git-and-trigger
    exec:
      label: "7. Re-arm git and the pipeline trigger"
      component: dev
      workingDir: ${PROJECT_SOURCE}
      commandLine: ./hack/setup-pipeline-trigger.sh
      group:
        kind: run

  - id: sync-with-pipeline
    exec:
      label: "8. Pull the tag commit the pipeline pushed"
      component: dev
      workingDir: ${PROJECT_SOURCE}
      commandLine: git pull --rebase origin main
      group:
        kind: run

events:
  # Sets git up so you can actually commit and push: identity, the deploy key,
  # the ssh remote, and the hook that starts the pipeline. Non-fatal by design.
  postStart:
    - setup-git-and-trigger
