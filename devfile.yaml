schemaVersion: 2.2.2
metadata:
  name: ice-demo
  displayName: ICE Demo - LocalNews Location Extractor
  description: Python workspace for the location-extractor microservice
  tags:
    - Python
    - Flask
    - OpenShift
  language: Python
  projectType: Python

projects:
  - name: ice-demo
    git:
      remotes:
        origin: https://github.com/maxisses/ice-demo.git
      checkoutFrom:
        revision: main

components:
  - name: python-dev
    container:
      # Red Hat Universal Developer Image: python, node, java, go plus
      # oc, tkn, helm and kubectl already on the PATH.
      image: registry.redhat.io/devspaces/udi-rhel9:latest
      memoryRequest: 1Gi
      memoryLimit: 6Gi
      cpuRequest: 200m
      cpuLimit: 2000m
      mountSources: true
      endpoints:
        - name: flask
          targetPort: 5000
          exposure: public
          protocol: https
      env:
        - name: PIP_CACHE_DIR
          value: /home/user/.cache/pip
        - name: ICE_DEMO_NAMESPACE
          value: md-ice-demo-part1
  - name: pip-cache
    volume:
      size: 2Gi

commands:
  - id: install-deps
    exec:
      label: "1. Install Python dependencies"
      component: python-dev
      workingDir: ${PROJECT_SOURCE}/components/location-extractor
      commandLine: |
        pip install --user -r requirements-dev.txt
        python -m spacy download en_core_web_md
      group:
        kind: build
        isDefault: true

  - id: run-tests
    exec:
      label: "2. Run the unit tests"
      component: python-dev
      workingDir: ${PROJECT_SOURCE}/components/location-extractor
      commandLine: python -m pytest test -v
      group:
        kind: test
        isDefault: true

  - id: run-dev
    exec:
      label: "3. Run the location-extractor locally"
      component: python-dev
      workingDir: ${PROJECT_SOURCE}/components/location-extractor
      commandLine: python -m src.server
      group:
        kind: run
        isDefault: true

  - id: setup-pipeline-trigger
    exec:
      label: "4. Arm the git hook that starts the Tekton pipeline"
      component: python-dev
      workingDir: ${PROJECT_SOURCE}
      commandLine: ./hack/setup-pipeline-trigger.sh
      group:
        kind: run

  - id: sync-with-pipeline
    exec:
      label: "5. Pull the tag commit the pipeline pushed"
      component: python-dev
      workingDir: ${PROJECT_SOURCE}
      commandLine: git pull --rebase origin main
      group:
        kind: run

events:
  postStart:
    - setup-pipeline-trigger
