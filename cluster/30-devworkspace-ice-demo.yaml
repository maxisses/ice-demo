# The lifecycle workspace, as applied with oc.
#
# The normal way in is the Dev Spaces dashboard, which resolves the editor for
# you from the factory URL:
#   https://devspaces.apps.ocp4.stormshift.coe.muc.redhat.com/#https://github.com/maxisses/ice-demo
#
# This file is the same workspace expressed directly, which is handy when you
# want it pre-created before a talk. It refers to a DevWorkspaceTemplate named
# che-code that has to exist in the same namespace - hack/create-editor-template.sh
# generates it from the cluster's own editor definitions.
#
# spec.template mirrors devfile.yaml in the repo root. Keep them in step.
apiVersion: workspace.devfile.io/v1alpha2
kind: DevWorkspace
metadata:
  name: ice-demo
  namespace: mdargatz-redhat-com-admin-devspaces-cyub7k
spec:
  started: true
  contributions:
  - kubernetes:
      name: che-code
    name: editor
  routingClass: che
  template:
    commands:
    - exec:
        commandLine: 'pip install --user -r requirements-dev.txt

          python -m spacy download en_core_web_md

          '
        component: python-dev
        group:
          isDefault: true
          kind: build
        label: 1. Install Python dependencies
        workingDir: ${PROJECT_SOURCE}/components/location-extractor
      id: install-deps
    - exec:
        commandLine: python -m pytest test -v
        component: python-dev
        group:
          isDefault: true
          kind: test
        label: 2. Run the unit tests
        workingDir: ${PROJECT_SOURCE}/components/location-extractor
      id: run-tests
    - exec:
        commandLine: python -m src.server
        component: python-dev
        group:
          isDefault: true
          kind: run
        label: 3. Run the location-extractor locally
        workingDir: ${PROJECT_SOURCE}/components/location-extractor
      id: run-dev
    - exec:
        commandLine: ./hack/setup-pipeline-trigger.sh
        component: python-dev
        group:
          kind: run
        label: 4. Re-arm the git hook that starts the Tekton pipeline
        workingDir: ${PROJECT_SOURCE}
      id: setup-pipeline-trigger
    - exec:
        commandLine: git pull --rebase origin main
        component: python-dev
        group:
          kind: run
        label: 5. Pull the tag commit the pipeline pushed
        workingDir: ${PROJECT_SOURCE}
      id: sync-with-pipeline
    components:
    - container:
        cpuLimit: 2000m
        cpuRequest: 200m
        endpoints:
        - exposure: public
          name: flask
          protocol: https
          targetPort: 5000
        env:
        - name: ICE_DEMO_NAMESPACE
          value: md-ice-demo-part1
        - name: PIP_CACHE_DIR
          value: /home/user/.cache/pip
        image: registry.redhat.io/devspaces/udi-rhel9:latest
        memoryLimit: 6Gi
        memoryRequest: 1Gi
        mountSources: true
        sourceMapping: /projects
        volumeMounts:
        - name: pip-cache
          path: /home/user/.cache/pip
      name: python-dev
    - name: pip-cache
      volume:
        size: 2Gi
    events:
      postStart:
      - setup-pipeline-trigger
    projects:
    - git:
        checkoutFrom:
          revision: main
        remotes:
          origin: https://github.com/maxisses/ice-demo.git
      name: ice-demo
