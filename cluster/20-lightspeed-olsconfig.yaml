# OpenShift Lightspeed, pointed at a model served outside this cluster.
#
# The credentials live in a secret called maas-api-key in openshift-lightspeed,
# which is NOT in this repo. Create it first:
#
#   oc create secret generic maas-api-key -n openshift-lightspeed \
#     --from-literal=apitoken='<your MaaS key>'
#
# The provider type is 'openai' because the gateway is OpenAI-compatible; the
# model behind it happens to be DeepSeek. Lightspeed is reachable only through
# the chat icon in the OpenShift console - NetworkPolicies in the
# openshift-lightspeed namespace keep the API to the console plugin.
apiVersion: ols.openshift.io/v1alpha1
kind: OLSConfig
metadata:
  name: cluster
spec:
  llm:
    providers:
      - name: maas
        type: openai
        url: https://maas-rhdp.apps.maas.redhatworkshops.io/v1
        credentialsSecretRef:
          name: maas-api-key
        credentialKey: apitoken
        models:
          - name: deepseek-r1-distill-qwen-14b
  ols:
    defaultProvider: maas
    defaultModel: deepseek-r1-distill-qwen-14b
    logLevel: INFO
    # Lets Lightspeed read cluster resources through the MCP server, so you can
    # ask it about what is actually running rather than only about the docs.
    introspectionEnabled: true
