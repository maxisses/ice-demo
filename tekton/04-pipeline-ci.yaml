apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: localnews-ci
  namespace: md-ice-demo-part1
  labels:
    app.kubernetes.io/part-of: ice-demo
spec:
  description: >-
    Clone, test, build, push - and then hand over to Argo CD by writing the new
    image tag back into the Git repository. Runs on every commit that comes out
    of the Dev Spaces workspace.
  params:
    - name: git-url
      type: string
      default: https://github.com/maxisses/ice-demo.git
    - name: git-push-url
      description: SSH remote used to push the image tag back into the repo.
      type: string
      default: git@github.com:maxisses/ice-demo.git
    - name: git-revision
      type: string
      default: main
    - name: image
      description: Image repository. The commit SHA becomes the tag.
      type: string
      default: quay.io/mdargatz/icedemo
    - name: context
      type: string
      default: components/location-extractor
  workspaces:
    - name: shared-workspace
    - name: dockerconfig
    - name: git-ssh
  results:
    - name: image
      description: The image that was built and rolled out.
      value: $(params.image):$(tasks.tag.results.SHORT_SHA)
  tasks:
    # 1 - get the code the developer just pushed from Dev Spaces
    - name: fetch-source
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: git-clone
          - name: namespace
            value: openshift-pipelines
      params:
        - name: URL
          value: $(params.git-url)
        - name: REVISION
          value: $(params.git-revision)
        - name: DELETE_EXISTING
          value: "true"
        - name: SUBDIRECTORY
          value: ice-demo
      workspaces:
        - name: output
          workspace: shared-workspace

    # 2 - the tag we are going to build
    - name: tag
      runAfter:
        - fetch-source
      taskRef:
        name: short-sha
      params:
        - name: COMMIT
          value: $(tasks.fetch-source.results.COMMIT)

    # 3 - unit tests, in the same image that carries the dependencies
    - name: unit-test
      runAfter:
        - fetch-source
      taskRef:
        name: pytest
      params:
        - name: CONTEXT
          value: ice-demo/$(params.context)
      workspaces:
        - name: source
          workspace: shared-workspace

    # 4 - build the container image and push it to quay.io
    - name: build-image
      runAfter:
        - unit-test
        - tag
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: buildah
          - name: namespace
            value: openshift-pipelines
      params:
        - name: IMAGE
          value: $(params.image):$(tasks.tag.results.SHORT_SHA)
        - name: DOCKERFILE
          value: Containerfile
        - name: CONTEXT
          value: ice-demo/$(params.context)
        - name: TLS_VERIFY
          value: "true"
      workspaces:
        - name: source
          workspace: shared-workspace
        - name: dockerconfig
          workspace: dockerconfig

    # 5 - write the new tag back into Git. Argo CD takes it from here.
    - name: update-gitops
      runAfter:
        - build-image
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: git-cli
          - name: namespace
            value: openshift-pipelines
      params:
        - name: GIT_USER_NAME
          value: tekton-pipeline
        - name: GIT_USER_EMAIL
          value: tekton@ice-demo.local
        - name: GIT_SCRIPT
          value: |
            set -eu
            rm -rf /tmp/gitops && mkdir -p /tmp/gitops
            git clone --depth 1 --branch $(params.git-revision) \
              $(params.git-push-url) /tmp/gitops/repo
            cd /tmp/gitops/repo

            cat > gitops/helm/values-image.yaml <<VALUES
            # This file is owned by the Tekton pipeline.
            # Every successful build rewrites it and pushes it back to Git.
            # Argo CD watches the repo and rolls the new tag out - that is the
            # whole GitOps loop in five lines of YAML.
            locationExtractor:
              imageTag: $(tasks.tag.results.SHORT_SHA)
            VALUES

            if git diff --quiet; then
              echo "values-image.yaml already points at $(tasks.tag.results.SHORT_SHA) - nothing to do"
              exit 0
            fi

            git add gitops/helm/values-image.yaml
            git commit -m "ci: roll location-extractor to $(tasks.tag.results.SHORT_SHA) [skip ci]"
            git push origin $(params.git-revision)
      workspaces:
        - name: source
          workspace: shared-workspace
        - name: ssh-directory
          workspace: git-ssh
